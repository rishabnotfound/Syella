name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release from this run'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syella-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Syella ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.pkg.outputs.version }}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Syella v${{ steps.pkg.outputs.version }} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Downloads

            Pick the file that matches your machine. **Bold** rows are the recommended pick for that platform.

            ### macOS

            | File | For |
            |---|---|
            | **`Syella-${{ steps.pkg.outputs.version }}-arm64.dmg`** | Apple Silicon (M1 / M2 / M3 / M4) — most Macs from 2020 onward |
            | `Syella-${{ steps.pkg.outputs.version }}.dmg` | Intel Macs (pre-2020) |

            Not sure which one you have? Click the Apple menu → **About This Mac**. If the chip line mentions **M1/M2/M3/M4**, use `arm64`. If it says **Intel**, use the plain `.dmg`.

            #### Installing on macOS — important

            Syella is not signed with an Apple Developer certificate (paid signing costs $99/yr and this is a free tool). macOS will quarantine the app on first launch. There are two clean ways to handle it:

            **Option A — recommended:** After mounting the DMG, **double-click `Install Syella.command`** in the DMG window. It copies the app into `/Applications` and clears the quarantine flag in one step.

            **Option B — if you dragged the app manually and see *"Syella is damaged and can't be opened"*:** open Terminal and run:

            ```bash
            xattr -cr /Applications/Syella.app
            ```

            Then reopen the app. This clears the quarantine attribute — the app is fine, it's just unsigned.

            ### Windows

            | File | For |
            |---|---|
            | **`Syella.Setup.${{ steps.pkg.outputs.version }}.exe`** | Standard installer — adds Start Menu + desktop shortcuts, supports uninstall |
            | `Syella-Portable-${{ steps.pkg.outputs.version }}.exe` | Portable single-file build — no install, runs from anywhere (USB stick, etc.) |

            #### Installing on Windows

            SmartScreen will warn on first run because the executable isn't code-signed. Click **More info** → **Run anyway**. This is a one-time prompt.

            ### Linux

            | File | For |
            |---|---|
            | **`Syella-${{ steps.pkg.outputs.version }}.AppImage`** | Universal — works on any distro (Ubuntu, Fedora, Arch, Debian, etc.) |
            | `syella_${{ steps.pkg.outputs.version }}_amd64.deb` | Debian / Ubuntu — integrates with the system package manager |

            #### Installing the AppImage

            ```bash
            chmod +x Syella-${{ steps.pkg.outputs.version }}.AppImage
            ./Syella-${{ steps.pkg.outputs.version }}.AppImage
            ```

            #### Installing the `.deb`

            ```bash
            sudo dpkg -i syella_${{ steps.pkg.outputs.version }}_amd64.deb
            sudo apt-get install -f    # only if dpkg reports missing dependencies
            ```

            ---

            Issues? Report them at https://github.com/rishabnotfound/Syella/issues

          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
