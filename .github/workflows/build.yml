name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release from this run'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syella-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compute release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Syella ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.pkg.outputs.version }}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Syella v${{ steps.pkg.outputs.version }} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Downloads — pick the right build for your machine

            ### macOS
            | File | For |
            |---|---|
            | **`Syella-${{ steps.pkg.outputs.version }}-arm64.dmg`** | Apple Silicon (M1, M2, M3, M4) — **most modern Macs** |
            | `Syella-${{ steps.pkg.outputs.version }}.dmg` | Intel Macs (pre-2020) |

            > On first open, mount the DMG and **double-click `Install Syella.command`** instead of dragging manually. This handles the macOS quarantine warning automatically. If you drag manually and see *"Syella is damaged"*, run `xattr -cr /Applications/Syella.app` in Terminal and reopen — the app is fine, it's just unsigned.

            ### Windows
            | File | For |
            |---|---|
            | **`Syella.Setup.${{ steps.pkg.outputs.version }}.exe`** | Standard installer — creates Start Menu + desktop shortcuts |
            | `Syella-Portable-${{ steps.pkg.outputs.version }}.exe` | Portable — single file, no install, runs from anywhere |

            > SmartScreen may warn on first run (unsigned) — click **More info** → **Run anyway**.

            ### Linux
            | File | For |
            |---|---|
            | **`Syella-${{ steps.pkg.outputs.version }}.AppImage`** | Universal — any distro (Ubuntu, Fedora, Arch, etc.). `chmod +x` and run. |
            | `syella_${{ steps.pkg.outputs.version }}_amd64.deb` | Debian / Ubuntu — `sudo dpkg -i syella_*.deb` |

            ---

            **Not sure which Mac you have?** Click Apple menu → About This Mac. If the chip says *M1/M2/M3/M4/etc.* → **arm64**. If it says *Intel* → the plain `.dmg`.

            ---
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
